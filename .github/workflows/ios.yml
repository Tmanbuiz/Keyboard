name: Build iPhone keyboard
on:
  push:
    branches: [main, 'feature/**', 'personal/**']
  workflow_dispatch:
permissions:
  contents: write # to publish the sideload IPA as a GitHub Release on main
concurrency:
  group: keyboard-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Check toolchain
        run: |
          mkdir -p build/logs
          xcodebuild -version | tee build/logs/toolchain.log
          echo "::notice title=Toolchain::$(xcodebuild -version | tr '\n' ' ') / $(xcrun --sdk iphoneos --show-sdk-version)"
      - name: Test typing engine
        run: set -o pipefail; swift test --jobs 2 2>&1 | tee build/logs/swift-test.log
      - name: Test writing service boundaries
        run: set -o pipefail; node --test Backend/*.test.mjs 2>&1 | tee build/logs/node-test.log
      - name: Build device app and package unsigned IPA
        run: set -o pipefail; bash Scripts/build_ipa.sh 2>&1 | tee build/logs/device.log
      - name: Upload compiled sideloading package
        uses: actions/upload-artifact@v4
        with:
          name: WianTribeKeyboard-personal-background-clipboard
          path: build/output/
          if-no-files-found: error
          retention-days: 1
      - name: Build simulator app
        run: |
          if [[ "$GITHUB_REF_NAME" == "personal/background-clipboard" ]]; then
            python3 Scripts/generate_project.py --personal-background-clipboard --ui-tests
          else
            python3 Scripts/generate_project.py --ui-tests
          fi
          set -o pipefail
          xcodebuild -project WianTribeKeyboard.xcodeproj -scheme WianTribeKeyboard \
            -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/simulator CODE_SIGNING_ALLOWED=NO build-for-testing 2>&1 | tee build/logs/simulator.log
      - name: Verify app launch and keyboard registration and typing
        run: python3 Scripts/simulator_smoke.py
      - name: Upload keyboard layout verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Keyboard-layout-verification
          path: build/verification/screenshots/
          if-no-files-found: warn
          retention-days: 1
      - name: Report compiler errors and warnings
        if: always()
        run: python3 Scripts/report_build.py build/logs
      - name: Upload verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Keyboard-verification-logs
          path: build/logs/
          if-no-files-found: warn
          retention-days: 1
      - name: Publish sideload IPA as a GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" build/device/Build/Products/Release-iphoneos/WianTribeKeyboard.app/Info.plist)
          tag="v${version}-build${{ github.run_number }}"
          cd build/output
          full="WianTribeKeyboard-${version}-build${{ github.run_number }}.ipa"
          lite="WianTribeKeyboard-${version}-build${{ github.run_number }}-keyboard-only.ipa"
          cp WianTribeKeyboard.ipa "$full"; cp WianTribeKeyboard-keyboard-only.ipa "$lite"
          sed -i '' -e "s/  WianTribeKeyboard.ipa/  $full/" -e "s/  WianTribeKeyboard-keyboard-only.ipa/  $lite/" SHA256SUMS.txt
          gh release create "$tag" --target "${{ github.sha }}" --prerelease \
            --title "WianTribe Keyboard ${version} (build ${{ github.run_number }})" \
            --notes "Ad-hoc signed IPAs for sideloading; your tool re-signs them. $full has the app, keyboard, iMessage stickers and the Save to WianTribe share extension. $lite has only the app and keyboard, for free Apple IDs that are short of App IDs. Keep the extensions when re-signing. See INSTALL.md. Commit ${{ github.sha }}." \
            "$full" "$lite" SHA256SUMS.txt INSTALL.md
          echo "::notice title=Sideload release::https://github.com/${{ github.repository }}/releases/tag/$tag"
