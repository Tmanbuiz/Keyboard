name: Build iPhone keyboard
on:
  push:
    branches: [main, 'feature/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: keyboard-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check toolchain
        run: |
          mkdir -p build/logs
          xcodebuild -version | tee build/logs/toolchain.log
          echo "::notice title=Toolchain::$(xcodebuild -version | tr '\n' ' ') / $(xcrun --sdk iphoneos --show-sdk-version)"
      - name: Test typing engine
        run: set -o pipefail; swift test --jobs 2 2>&1 | tee build/logs/swift-test.log
      - name: Test writing service boundaries
        run: set -o pipefail; node --test Backend/*.test.mjs 2>&1 | tee build/logs/node-test.log
      - name: Build device app and package unsigned IPA
        run: set -o pipefail; bash Scripts/build_ipa.sh 2>&1 | tee build/logs/device.log
      - name: Validate TestFlight capabilities without signing
        run: |
          python3 Scripts/generate_project.py --shared-container
          xcodebuild -project WianTribeKeyboard.xcodeproj -scheme WianTribeKeyboard -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/shared CODE_SIGNING_ALLOWED=NO build > build/logs/shared.log 2>&1
      - name: Build simulator app
        run: >-
          set -o pipefail; xcodebuild -project WianTribeKeyboard.xcodeproj -scheme WianTribeKeyboard
          -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build/simulator CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build/logs/simulator.log
      - name: Launch companion app in simulator
        run: python3 Scripts/simulator_smoke.py
      - name: Report compiler errors and warnings
        if: always()
        run: python3 Scripts/report_build.py build/logs
      - name: Upload sideloading package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: WianTribeKeyboard-sideload
          path: build/output/
          if-no-files-found: error
          retention-days: 7
  release:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download tested package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: WianTribeKeyboard-sideload
          path: release
      - name: Verify checksums and publish
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          sha256sum -c SHA256SUMS.txt
          version=$(python3 -c 'import zipfile,plistlib; z=zipfile.ZipFile("WianTribeKeyboard.ipa"); print(plistlib.loads(z.read("Payload/WianTribeKeyboard.app/Info.plist"))["CFBundleShortVersionString"])')
          full="WianTribeKeyboard-${version}-build${BUILD_NUMBER}.ipa"
          lite="WianTribeKeyboard-${version}-build${BUILD_NUMBER}-keyboard-only.ipa"
          mv WianTribeKeyboard.ipa "$full"
          mv WianTribeKeyboard-keyboard-only.ipa "$lite"
          sha256sum "$full" "$lite" > SHA256SUMS.txt
          gh release create "v${version}-build${BUILD_NUMBER}" --repo "$REPOSITORY" --target "$COMMIT" --prerelease \
            --title "WianTribe Keyboard ${version} (build ${BUILD_NUMBER})" \
            --notes "Tested ad-hoc signed packages for sideloading. Keep the extensions when re-signing. See INSTALL.md. Commit ${COMMIT}." \
            "$full" "$lite" SHA256SUMS.txt INSTALL.md
