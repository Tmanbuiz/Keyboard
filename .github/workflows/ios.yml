name: Build iPhone keyboard
on:
  push:
    branches: [main, 'feature/**']
  workflow_dispatch:
permissions:
  contents: write # to publish the sideload IPA as a GitHub Release on main
concurrency:
  group: keyboard-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Check toolchain
        run: |
          mkdir -p build/logs
          xcodebuild -version | tee build/logs/toolchain.log
          echo "::notice title=Toolchain::$(xcodebuild -version | tr '\n' ' ') / $(xcrun --sdk iphoneos --show-sdk-version)"
      - name: Test typing engine
        run: set -o pipefail; swift test --jobs 2 2>&1 | tee build/logs/swift-test.log
      - name: Test writing service boundaries
        run: set -o pipefail; node --test Backend/*.test.mjs 2>&1 | tee build/logs/node-test.log
      - name: Build device app and package unsigned IPA
        run: set -o pipefail; bash Scripts/build_ipa.sh 2>&1 | tee build/logs/device.log
      - name: Build simulator app
        run: >-
          set -o pipefail; xcodebuild -project WianTribeKeyboard.xcodeproj -scheme WianTribeKeyboard
          -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build/simulator CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build/logs/simulator.log
      - name: Launch companion app in simulator
        run: python3 Scripts/simulator_smoke.py
      - name: Report compiler errors and warnings
        if: always()
        run: python3 Scripts/report_build.py build/logs
      - name: Upload sideloading package
        uses: actions/upload-artifact@v4
        with:
          name: WianTribeKeyboard-sideload
          path: build/output/
          if-no-files-found: error
          retention-days: 7
      - name: Publish sideload IPA as a GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" build/device/Build/Products/Release-iphoneos/WianTribeKeyboard.app/Info.plist)
          tag="v${version}-build${{ github.run_number }}"
          cp build/output/WianTribeKeyboard-unsigned.ipa "build/output/WianTribeKeyboard-${version}-build${{ github.run_number }}-unsigned.ipa"
          gh release create "$tag" --target "${{ github.sha }}" --prerelease \
            --title "WianTribe Keyboard ${version} (build ${{ github.run_number }})" \
            --notes "Unsigned IPA for sideloading. Re-sign it with your sideloading tool and keep both extensions (keyboard and iMessage stickers). See docs/INSTALL.md. Commit ${{ github.sha }}." \
            "build/output/WianTribeKeyboard-${version}-build${{ github.run_number }}-unsigned.ipa" build/output/SHA256SUMS.txt build/output/INSTALL.md
          echo "::notice title=Sideload release::https://github.com/${{ github.repository }}/releases/tag/$tag"
