name: Upload to TestFlight
# Run from the Actions tab ("Run workflow"). Signs with your Apple Developer account through an
# App Store Connect API key and uploads the build to App Store Connect / TestFlight. No Mac needed.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: testflight
  cancel-in-progress: false
jobs:
  upload:
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets are set
        run: |
          missing=""
          for name in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            [ -n "$(printenv "SECRET_$name")" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then echo "::error title=Missing secrets::Add these in Settings → Secrets and variables → Actions:$missing"; exit 1; fi
        env:
          SECRET_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SECRET_ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          SECRET_ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          SECRET_ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      - name: Save the API key for Xcode
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        # Accepts the key however it was pasted (Windows line endings, squashed onto one line,
        # stray spaces or quotes, or only the middle part) and rebuilds a clean PEM file.
        # Never prints the key itself.
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          python3 - "$RUNNER_TEMP/keys/AuthKey.p8" <<'PY'
          import base64, os, re, sys
          raw = os.environ.get("ASC_KEY_P8", "")
          text = raw.replace("\r", "").strip().strip('"').strip("'")
          text = text.replace("\\n", "\n")
          body = re.sub(r"-----(BEGIN|END)[A-Z ]*-----", "", text)
          body = re.sub(r"[^A-Za-z0-9+/=]", "", body)
          def fail(msg):
              print(f"::error title=ASC_KEY_P8 looks wrong::{msg} Open the AuthKey_XXXX.p8 file you downloaded in Notepad, press Ctrl+A then Ctrl+C, and paste it as the new value of the ASC_KEY_P8 secret (Settings → Secrets and variables → Actions → ASC_KEY_P8 → Update).")
              sys.exit(1)
          if not body:
              fail("The secret is empty.")
          if re.fullmatch(r"[A-Z0-9]{10}", body) or "-" in raw and len(body) < 60:
              fail("It looks like an ID was pasted instead of the key file's contents.")
          try:
              der = base64.b64decode(body + "=" * (-len(body) % 4), validate=False)
          except Exception:
              fail("The contents are not a valid key.")
          if len(der) < 100 or der[0] != 0x30:
              fail(f"The contents are not a valid key ({len(body)} characters found; an Apple key has about 200).")
          lines = [body[i:i + 64] for i in range(0, len(body), 64)]
          pem = "-----BEGIN PRIVATE KEY-----\n" + "\n".join(lines) + "\n-----END PRIVATE KEY-----\n"
          with open(sys.argv[1], "w") as f:
              f.write(pem)
          print(f"Key file prepared ({len(body)} characters).")
          PY
          chmod 600 "$RUNNER_TEMP/keys/AuthKey.p8"
      - name: Generate the App Store project (with the shared App Group)
        run: python3 Scripts/generate_project.py --shared-container
      - name: Archive
        run: |
          set -o pipefail
          mkdir -p build/logs
          xcodebuild -project WianTribeKeyboard.xcodeproj -scheme WianTribeKeyboard -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/WianTribeKeyboard.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            archive 2>&1 | tee build/logs/archive.log
      - name: Check the sticker pack
        run: |
          appex="build/WianTribeKeyboard.xcarchive/Products/Applications/WianTribeKeyboard.app/PlugIns/WianTribeStickers.appex"
          echo "::notice title=Sticker files::$(ls "$appex" | tr '\n' ' ')"
          echo "::notice title=Sticker Info.plist::$(plutil -convert json -o - "$appex/Info.plist" | head -c 900)"
          n=$(grep -n "actool .*xcstickers" build/logs/archive.log | head -1 | cut -d: -f1)
          if [ -n "$n" ]; then
            cmd=$(sed -n "${n}p" build/logs/archive.log | sed 's#/Users/runner/Library/Developer/Xcode/DerivedData/[^/]*/Build/Intermediates.noindex/ArchiveIntermediates/WianTribeKeyboard/IntermediateBuildFilesPath/WianTribeKeyboard.build/Release-iphoneos/##g')
            for i in 0 900 1800 2700; do part="${cmd:$i:900}"; [ -n "$part" ] && echo "::notice title=actool command $i::$part"; done
            sed -n "$((n+1)),$((n+25))p" build/logs/archive.log | grep -v "^$" | head -20 | while read -r line; do echo "::notice title=actool output::${line:0:500}"; done
          fi
          partial=$(find ~/Library/Developer/Xcode/DerivedData -path "*WianTribeStickers.build*" -name "assetcatalog_generated_info*.plist" | head -1)
          [ -n "$partial" ] && echo "::notice title=actool partial plist::$(plutil -convert json -o - "$partial" | head -c 900)"
          out=$(find ~/Library/Developer/Xcode/DerivedData -path "*WianTribeStickers.build/assetcatalog_output*" -type f | sed 's#.*/assetcatalog_output/##' | tr '\n' ' ')
          echo "::notice title=actool produced::$out"
          grep -n -i "warning" build/logs/archive.log | grep -i -E "sticker|xcstickers|iMessage" | head -5 | while read -r line; do echo "::warning::${line:0:600}"; done
      - name: Upload to App Store Connect
        run: |
          set -o pipefail
          cat > build/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath build/WianTribeKeyboard.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            2>&1 | tee build/logs/upload.log
          echo "::notice title=Uploaded::Build ${{ github.run_number }} was sent to App Store Connect. It appears in TestFlight after Apple finishes processing (usually 10–30 minutes)."
      - name: Report errors
        if: failure()
        run: |
          grep -hE "error:|Error Domain|No profiles|No Account|provisioning|ITMS-" build/logs/*.log 2>/dev/null | sort -u | head -30 | while read -r line; do
            echo "::error::${line:0:900}"
          done
      - name: Remove the key file
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
